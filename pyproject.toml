[project]
name = "klaviyo-agent-demo"
version = "0.1.0"
description = "A LangGraph multi-agent demo of an autonomous marketing campaign generator. Built as a sketch for a Klaviyo Marketing Agent AI Engineer II conversation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bharath Kumar" },
]
dependencies = [
    "anthropic>=0.39.0",
    "langgraph>=0.2.0",
    "langfuse>=2.50.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
