# Fly config for klaviyo-agent-demo.
#
# Single app, single machine, two processes inside the container:
#   - Streamlit (public) on 8080
#   - FastAPI (internal-only) on 127.0.0.1:8000
#
# Auto-stop is on so the machine sleeps when idle (~3-5s cold start on wake).
# Set ANTHROPIC_API_KEY via `flyctl secrets set` before first deploy.

app = "klaviyo-agent-demo"
primary_region = "ord"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
